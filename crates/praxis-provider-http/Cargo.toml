[package]
name = "praxis-provider-http"
version = "0.1.0"
edition = "2021"

[dependencies]
praxis-provider-api = { path = "../praxis-provider-api" }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde_json = "1"
httpdate = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt"] }
