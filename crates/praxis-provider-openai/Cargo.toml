[package]
name = "praxis-provider-openai"
version = "0.1.0"
edition = "2021"

[dependencies]
praxis-provider-api = { path = "../praxis-provider-api" }
praxis-provider-http = { path = "../praxis-provider-http" }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
wiremock = "0.6"
