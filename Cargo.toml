[package]
name = "praxis"
version = "1.0.3"
edition = "2021"
description = "AI Agent Platform — Praxis"

[workspace]
members = ["crates/praxis-vm"]
default-members = ["."]
resolver = "2"

[features]
default = ["compatibility"]
compatibility = ["vm"]
vm = ["dep:praxis-vm"]
voice_vosk = ["vosk"]
voice_whisper = ["whisper-rs"]
songbird = ["dep:songbird"]
vosk = ["dep:vosk"]

[dependencies]
praxis-vm = { path = "crates/praxis-vm", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
tracing = "0.1"
tracing-attributes = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
anyhow = "1"
image = "0.25"
png = "0.18"
serenity = { version = "0.12", features = ["voice"] }
axum = { version = "0.7", features = ["ws", "json", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
rustls-pemfile = "2"
rcgen = "0.13"
hostname = "0.4"
tokio-stream = "0.1"
tempfile = "3"
tokio-util = { version = "0.7", features = ["codec", "rt"] }
httpdate = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
once_cell = "1"
regex = "1"
base64 = "0.22"
lazy_static = "1"
async-trait = "0.1"
dashmap = "6"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
rpassword = "7"
zeroize = "1"
libc = "0.2"
shlex = "1.3"
sha2 = "0.10"
urlencoding = "2.1"
jsonwebtoken = "9"
bcrypt = "0.16"
tower-http = { version = "0.6", features = ["cors", "auth", "fs"] }
governor = "0.8"
cron = "0.15"
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }
backon = "1"
ratatui = "0.29"
unicode-segmentation = "1"
crossterm = { version = "0.28", features = ["event-stream"] }

vosk = { version = "0.3", optional = true }
whisper-rs = { version = "0.1", optional = true }
songbird = { version = "0.6", optional = true, features = ["driver", "builtin-queue", "serenity", "receive"] }
symphonia = { version = "0.5", features = ["all"] }
minimp3 = "0.5"
hound = "3.5"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
tempfile = "3"
