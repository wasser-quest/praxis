[package]
name = "praxis"
version = "1.0.3"
edition = "2021"
description = "AI Agent Platform — Praxis"

[workspace]
members = ["crates/praxis-vm", "crates/praxis-plugin-api", "crates/praxis-voice", "crates/praxis-comfyui", "crates/praxis-provider-api", "crates/praxis-gpu-router", "crates/praxis-tui", "crates/praxis-vm-web", "crates/praxis-vm-worker", "crates/praxis-dashboard", "crates/praxis-legacy-file-ops", "crates/praxis-shell", "crates/praxis-vision"]
default-members = ["."]
resolver = "2"

[features]
default = ["compatibility"]
compatibility = ["vm", "dashboard", "legacy_file_ops", "shell", "vision", "voice", "discord"]
# Legacy read/edit implementation; omitted entirely from a core-only host.
# The independently installed package serves the same tool names.
legacy_file_ops = ["dep:praxis-legacy-file-ops"]
# Raw shell execution and background jobs; omitted entirely from a core-only
# host. The independently installed package serves the same tool names.
shell = ["dep:praxis-shell"]
# Raw image loading for understand_image; omitted from a core-only host.
vision = ["dep:praxis-vision"]
# Voice/audio: transcription, synthesis and their ComfyUI backends; omitted
# entirely from a core-only host.
voice = []
# Discord channel ingress and its voice glue (pulls the voice layer).
discord = ["dep:serenity", "dep:hound", "voice"]
# Web dashboard: UI, listener, TLS and its static assets. The runtime,
# gateway, CLI and verified workflows work without it.
dashboard = ["dep:axum-server", "dep:rcgen", "dep:hostname"]
vm = ["dep:praxis-vm", "dep:praxis-vm-web"]
voice_vosk = ["praxis-voice/voice_vosk"]
voice_whisper = ["praxis-voice/voice_whisper"]
songbird = ["dep:songbird"]
vosk = ["voice_vosk"]

[dependencies]
praxis-plugin-api = { path = "crates/praxis-plugin-api" }
praxis-provider-api = { path = "crates/praxis-provider-api" }
praxis-comfyui = { path = "crates/praxis-comfyui" }
praxis-voice = { path = "crates/praxis-voice" }
praxis-gpu-router = { path = "crates/praxis-gpu-router" }
praxis-legacy-file-ops = { path = "crates/praxis-legacy-file-ops", optional = true }
praxis-shell = { path = "crates/praxis-shell", optional = true }
praxis-vision = { path = "crates/praxis-vision", optional = true }
praxis-vm = { path = "crates/praxis-vm", optional = true }
praxis-vm-web = { path = "crates/praxis-vm-web", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
tracing = "0.1"
tracing-attributes = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
anyhow = "1"
png = "0.18"
serenity = { version = "0.12", features = ["voice"], optional = true }
axum = { version = "0.7", features = ["ws", "json", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", optional = true }
hostname = { version = "0.4", optional = true }
tokio-stream = "0.1"
tempfile = "3"
tokio-util = { version = "0.7", features = ["codec", "rt"] }
httpdate = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
once_cell = "1"
regex = "1"
base64 = "0.22"
lazy_static = "1"
async-trait = "0.1"
dashmap = "6"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
rpassword = "7"
zeroize = "1"
libc = "0.2"
shlex = "1.3"
sha2 = "0.10"
urlencoding = "2.1"
jsonwebtoken = "9"
bcrypt = "0.16"
tower-http = { version = "0.6", features = ["cors", "auth", "fs"] }
governor = "0.8"
cron = "0.15"
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }
backon = "1"

songbird = { version = "0.6", optional = true, features = ["driver", "builtin-queue", "serenity", "receive"] }
hound = { version = "3.5", optional = true }

image = "0.25"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
tempfile = "3"
