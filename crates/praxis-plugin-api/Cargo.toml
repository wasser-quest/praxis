[package]
name = "praxis-plugin-api"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded local process protocol for Praxis feature services"

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "io-std", "process", "sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
