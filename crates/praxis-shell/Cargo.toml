[package]
name = "praxis-shell"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Optional raw shell execution and durable background jobs for Praxis"

[dependencies]
praxis-plugin-api = { path = "../praxis-plugin-api" }
async-trait = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[[bin]]
name = "praxis-shell"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
