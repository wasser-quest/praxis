[package]
name = "praxis-vm"
version = "0.1.0"
edition = "2021"
description = "Optional QEMU VM backend for Praxis"
license = "MIT"

[dependencies]
praxis-plugin-api = { path = "../praxis-plugin-api" }
async-trait = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
base64 = "0.22"
png = "0.18"
chrono = "0.4"
regex = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[[bin]]
name = "praxis-vm-service"
path = "src/bin/service.rs"
